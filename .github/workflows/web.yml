name: Next.js checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Test SRT parsing and serialization
        run: node scripts/srt-test.mjs
      - run: npm run build
      - name: Test server-rendered pages and SEO
        run: node scripts/pages-smoke.mjs
      - name: Install gateway smoke dependencies
        working-directory: .
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          sudo apt-get update -qq
          sudo apt-get install -y nginx
      - name: Install browser for upload checks
        run: npx playwright install --with-deps chromium
      - name: Test actual Nginx media routing
        run: node scripts/gateway-smoke.mjs
      - name: Build standalone web image
        run: docker build -t subtitle-web:test .
      - name: Check Compose configuration
        working-directory: .
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml -f docker-compose.next.yml config --quiet
