name: Backend checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: subtitles
          POSTGRES_PASSWORD: test
          POSTGRES_DB: subtitles
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U subtitles" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build Next.js API for split-process integration
        run: npm ci --prefix web && npm run build --prefix web
      - name: Test durable lifecycle against PostgreSQL
        run: node --test test/durable.integration.js
        env:
          DATABASE_URL: postgres://subtitles:test@localhost:5432/subtitles
