# nginx/subtitle-service.conf
# Place in /etc/nginx/sites-available/ and symlink into sites-enabled/
# Replace your.domain.com with your actual domain.

upstream subtitle_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your.domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your.domain.com;

    # TLS (use certbot: certbot --nginx -d your.domain.com)
    ssl_certificate     /etc/letsencrypt/live/your.domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your.domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Must be >= MAX_FILE_SIZE_MB in .env (300 MB + overhead)
    client_max_body_size 350M;
    client_body_timeout  600s;

    proxy_connect_timeout 10s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    # --- HTTP ---
    location / {
        proxy_pass         http://subtitle_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # --- Upload: don't buffer gigabytes inside nginx ---
    location /upload {
        proxy_pass           http://subtitle_backend;
        proxy_http_version   1.1;
        proxy_request_buffering off;
        proxy_set_header     Host              $host;
        proxy_set_header     X-Real-IP         $remote_addr;
        proxy_set_header     X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header     X-Forwarded-Proto $scheme;
        proxy_set_header     Connection        "";
    }

    # --- WebSocket ---
    location /ws {
        proxy_pass         http://subtitle_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Whisper on CPU can run for hours — the socket must survive the whole job.
        # Keep >= SCRIPT_TIMEOUT_MS (default 4h = 14400s).
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;
    }
}
