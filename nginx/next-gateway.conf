# HTTP gateway behind the existing host TLS proxy. All browser traffic is same-origin.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}
upstream media_backend {
    server subtitle-service:3000;
}
upstream next_web {
    server web:3001;
}
server {
    listen 80;
    server_name _;
    client_max_body_size 350M;
    client_body_timeout 600s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location = /upload {
        proxy_request_buffering off;
        proxy_pass http://media_backend;
    }
    location = /ws {
        proxy_pass http://media_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 14400s;
        proxy_send_timeout 14400s;
    }
    location ~ ^/(videos|outputs)(/|$) {
        # Range and license cookies pass through unchanged.
        proxy_pass http://media_backend;
    }
    location / {
        proxy_buffering off;
        proxy_pass http://next_web;
    }
}
