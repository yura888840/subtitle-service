# Opt-in migration stack: docker compose -f docker-compose.yml -f docker-compose.next.yml up -d --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: subtitles
      POSTGRES_DB: subtitles
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - subtitle-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subtitles -d subtitles"]
      interval: 5s
      timeout: 5s
      retries: 10
  subtitle-service:
    environment:
      DATABASE_URL: postgres://subtitles:${POSTGRES_PASSWORD}@postgres:5432/subtitles
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a random value of at least 32 characters}
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    env_file:
      - .env
    environment:
      MEDIA_API_URL: http://subtitle-service:3000
      DATABASE_URL: postgres://subtitles:${POSTGRES_PASSWORD}@postgres:5432/subtitles
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a random value of at least 32 characters}
      UPLOAD_DIR: /app/uploads
      SITE_URL: ${SITE_URL:-}
    restart: unless-stopped
    init: true
    # Nginx is the public entry point; no host port or media volumes here.
    expose:
      - '3001'
    mem_limit: 512m

  worker:
    build: .
    image: subtitle-service:latest
    command: ["node", "src/durable/worker-main.js"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://subtitles:${POSTGRES_PASSWORD}@postgres:5432/subtitles
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET to a random value of at least 32 characters}
      UPLOAD_DIR: /app/uploads
    volumes:
      - subtitle-uploads:/app/uploads
      - whisper-models:/app/.cache
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    init: true
    cpus: "4.0"
    mem_limit: 12g
    stop_grace_period: 15s
    healthcheck:
      disable: true

  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    volumes:
      - ./nginx/next-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      subtitle-service:
        condition: service_healthy

volumes:
  subtitle-db:
